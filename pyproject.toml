[project]
name = "ebook-audiobook"
version = "1.1.3"
description = "Offline, local ebook-to-audiobook converter with a single high-quality narrator voice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "denelson1" }]
keywords = ["audiobook", "tts", "epub", "m4b", "plex", "chatterbox", "offline"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core deps keep the whole pipeline (extract -> normalize -> chunk -> assemble ->
# package) runnable and testable WITHOUT a GPU or the heavy TTS engine. The real
# TTS engine lives behind the optional [tts] extra and is imported lazily.
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",         # production WSGI server; pure Python, works on Windows
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "inflect>=7.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "mutagen>=1.47",
    # Ships a static ffmpeg binary for Windows/macOS/Linux so users don't have to
    # install one. A system ffmpeg on PATH is always preferred when present (it
    # also brings ffprobe, which this wheel does not include).
    "imageio-ffmpeg>=0.5",
    # The tray icon, so a render that outlives its window is still visible and
    # can be quit on purpose. Every import of these is guarded: the app runs
    # trayless (see ebook_audiobook.desktop) wherever they don't work, which
    # includes headless boxes, SSH sessions, and GNOME/Wayland.
    "pystray>=0.19",
    "pillow>=10.0",          # pystray loads the icon through it
    # pystray already declares the per-platform bindings it needs (Quartz on
    # macOS, python-xlib on Linux), so those are NOT repeated here. Quartz is
    # named explicitly only because we import it ourselves, in
    # desktop/tray.py, to ask whether there is a window server at all before
    # letting AppKit near a headless process.
    "pyobjc-framework-Quartz>=7.0 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# The GPU TTS engine. Installed separately because torch is large and its wheel
# depends on your CUDA setup. The installer picks the right torch build for the
# machine; see CONTRIBUTING.md to do it by hand.
# Pinned exactly, and it has to be. PyPI's torch runs well ahead of the pinned
# PyTorch indexes, and PEP 440 ranks a plain 2.13.0 above 2.9.1+cu128 — so an
# unpinned "torch" here resolves to the default CUDA build from PyPI and undoes
# whichever build the installer chose. Keep in step with
# ebook_audiobook.torchbuild.TORCH_PIN; CI asserts the resolution.
#
# chatterbox-tts is deliberately absent: it declares torch==2.6.0, which has no
# kernels for current GPUs. The installer puts it in with --no-deps and supplies
# its dependencies from torchbuild.CHATTERBOX_DEPS.
tts = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    # Chatterbox's watermarker dep (resemble-perth) still imports pkg_resources,
    # which setuptools removed in 81. Pin below that until perth is updated.
    "setuptools<81",
]
dev = [
    "pytest>=8.0",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/denelson1-dot/ebook-audiobook"
Source = "https://github.com/denelson1-dot/ebook-audiobook"
Issues = "https://github.com/denelson1-dot/ebook-audiobook/issues"

[project.scripts]
ebook-audiobook = "ebook_audiobook.cli:main"

# Windows: launched via pythonw.exe, so a desktop/Start-menu shortcut opens the
# web UI without a console window flashing up behind the browser.
[project.gui-scripts]
ebook-audiobook-gui = "ebook_audiobook.cli:main_gui"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ebook_audiobook*"]

# Jinja templates and static assets are not .py files, so they must be declared
# explicitly or the built wheel serves a UI with no templates (every page 500s).
# The icons are the same hazard one step quieter: a wheel without them starts
# fine and simply has no tray icon and a generic window, which nothing notices.
[tool.setuptools.package-data]
"ebook_audiobook.web" = ["templates/*.html", "static/*"]
"ebook_audiobook" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "calibre: integration test that shells out to Calibre's ebook-convert",
    "ffmpeg: integration test that shells out to ffmpeg",
]
filterwarnings = [
    # We deliberately parse XHTML with the HTML parser for text extraction.
    "ignore::bs4.XMLParsedAsHTMLWarning",
]
