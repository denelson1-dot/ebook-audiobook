name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      # A tag that disagrees with pyproject.toml produces a release whose
      # installer points at a wheel filename that doesn't exist. Catch it here.
      - name: Tag must match pyproject version
        run: |
          PYPROJECT=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$PYPROJECT" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag says ${{ steps.version.outputs.version }} but pyproject.toml says $PYPROJECT"
            exit 1
          fi
          echo "version $PYPROJECT confirmed"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist

      - name: Verify the wheel contains its data files
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = ["ebook_audiobook/web/templates/base.html",
                      "ebook_audiobook/web/static/app.css"]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit("MISSING FROM WHEEL: " + ", ".join(missing))
          print(f"{wheel} verified")
          PY

      - name: Smoke-test the built wheel
        run: |
          python -m venv verify
          verify/bin/python -m pip install --quiet --upgrade pip
          verify/bin/python -m pip install --quiet dist/*.whl
          verify/bin/ebook-audiobook check --engine fake || true
          verify/bin/python ci/assert_prereqs.py
          verify/bin/python ci/smoke_render.py
          verify/bin/python ci/smoke_web.py

      # Publish the installers under names that say who they are for, so the
      # release's file list is self-explanatory rather than two cryptic scripts.
      # Deliberately version-FREE: `releases/latest/download/<name>` can only
      # resolve a fixed filename, and that URL is the documented one-liner. The
      # version still travels inside the script (stamped below) so it always
      # fetches the wheel it belongs to.
      - name: Stamp the installers with this version
        run: |
          mkdir -p out
          sed "s/__EBAB_VERSION__/${{ steps.version.outputs.version }}/" install.sh  > out/install-macos-linux.sh
          sed "s/__EBAB_VERSION__/${{ steps.version.outputs.version }}/" install.ps1 > out/install-windows.ps1
          chmod +x out/install-macos-linux.sh
          grep -q "${{ steps.version.outputs.version }}" out/install-macos-linux.sh
          grep -q "${{ steps.version.outputs.version }}" out/install-windows.ps1
          echo "installers stamped"

      # Cover the installers too, not just the wheel. They are what people pipe
      # into a shell, so they are the assets most worth being able to verify.
      - name: Checksums
        run: |
          cp out/install-macos-linux.sh out/install-windows.ps1 dist/
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          rm -f install-macos-linux.sh install-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*
            out/install-macos-linux.sh
            out/install-windows.ps1

  # Prove the published installers work on all three OSes before the release is
  # visible, by running them against the wheel this build produced.
  verify-installers:
    name: verify installer on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from the source tree (same code path, no release needed yet)
        if: runner.os != 'Windows'
        run: bash install.sh --yes --no-tts
      - name: Install from the source tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Yes -NoTts
      - name: Verify
        if: runner.os != 'Windows'
        run: |
          "$HOME/.local/bin/ebook-audiobook" check --engine fake || true
          # Don't guess where the venv is: macOS puts it under
          # "Library/Application Support", Linux under ~/.local/share. The
          # launcher the installer wrote knows, so read the interpreter out of it.
          VENV_PY=$(sed -n 's#^exec "\(.*\)/ebook-audiobook".*#\1/python#p' \
                    "$HOME/.local/bin/ebook-audiobook")
          test -x "$VENV_PY" || { echo "couldn't locate the installed interpreter"; exit 1; }
          echo "using $VENV_PY"
          "$VENV_PY" ci/assert_prereqs.py
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cmd = Join-Path $env:LOCALAPPDATA "ebook-audiobook\bin\ebook-audiobook.cmd"
          # Calibre is absent on the runner, so a non-zero exit is expected and
          # deliberately ignored here; assert_prereqs.py makes the real judgement.
          & $cmd check --engine fake
          $global:LASTEXITCODE = 0
          $py = Join-Path $env:LOCALAPPDATA "ebook-audiobook\venv\Scripts\python.exe"
          & $py ci/assert_prereqs.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

  publish:
    name: Publish the release
    needs: [build, verify-installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: artifacts

      - name: Assemble the assets
        run: |
          mkdir -p upload
          cp artifacts/dist/* upload/
          cp artifacts/out/install-macos-linux.sh artifacts/out/install-windows.ps1 upload/
          ls -la upload/

      - name: Release notes
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          REPO="${{ github.repository }}"
          cat > NOTES.md <<EOF
          ### Which download do I need?

          | Your computer | File |
          |---|---|
          | **Windows** 10 / 11 (64-bit) | \`install-windows.ps1\` |
          | **macOS** — Apple Silicon (M1 and later) | \`install-macos-linux.sh\` |
          | **macOS** — Intel | \`install-macos-linux.sh\` — see the note below |
          | **Linux** — x86-64 or ARM64 | \`install-macos-linux.sh\` |

          You don't need to pick an architecture: the app itself is pure Python and
          runs anywhere, and the installer detects your CPU and GPU and fetches the
          matching PyTorch build (NVIDIA CUDA, AMD ROCm, Apple Metal, or CPU-only).

          The \`.whl\` and \`.tar.gz\` are the Python package, for installing with
          \`pip\` yourself. Most people want one of the two installers above.
          \`SHA256SUMS.txt\` lets you verify any of them.

          ## Install

          **macOS / Linux**
          \`\`\`bash
          curl -fsSL https://github.com/$REPO/releases/download/v$VERSION/install-macos-linux.sh | bash
          \`\`\`

          **Windows** (PowerShell)
          \`\`\`powershell
          irm https://github.com/$REPO/releases/download/v$VERSION/install-windows.ps1 | iex
          \`\`\`

          The installer sets up its own private Python environment, picks the right
          PyTorch build for your machine, and offers to install Calibre if it's missing.
          Nothing is installed system-wide and no administrator rights are needed.

          After installing, run \`ebook-audiobook\` (or use the Start Menu / application
          menu entry). See the [README](https://github.com/$REPO#readme) for the full guide.

          ### Requirements
          - Python 3.11+ (the installer offers to install it)
          - [Calibre](https://calibre-ebook.com/download) — reads your ebook files
          - ffmpeg is **included**, no separate install needed

          ### Hardware
          | | Speed for a ~110,000-word novel |
          |---|---|
          | NVIDIA GPU (Windows / Linux) | 2–3 hours |
          | AMD Radeon (Linux, ROCm) | 3–4 hours |
          | Apple Silicon, macOS 12.3+ (Metal) | a few hours |
          | No GPU, or Intel Mac | many hours — leave it overnight |

          > **Intel Macs**: PyTorch stopped shipping Intel-Mac builds after 2.2.2, so
          > the speech engine can't be installed there. The app installs and everything
          > except rendering works.

          ### Verified on
          Windows, macOS, and Linux — Python 3.11, 3.12, and 3.13.
          EOF
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ebook-audiobook ${{ needs.build.outputs.version }} — Windows, macOS, Linux
          body_path: NOTES.md
          files: upload/*
          draft: false
          prerelease: false
