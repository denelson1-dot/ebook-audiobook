name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core promise: the app works on Windows, macOS, and Linux. Every job here
  # runs WITHOUT installing ffmpeg, because that's the configuration real users
  # are in — they get the static binary from the imageio-ffmpeg wheel.
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
        # macOS runners bill at 10x on private repos. The Python-version axis is
        # about language compatibility, which is not macOS-specific, so cover all
        # three versions on Linux and Windows and one on macOS. macOS-specific
        # behaviour (the Calibre .app lookup, Application Support paths) is
        # covered by tests/test_platform.py, which runs everywhere.
        exclude:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Informational. Calibre isn't on the runners, so `check` exits non-zero by
      # design here — that's the correct behaviour being reported, not a failure
      # of this build. The assertion lives in the next step.
      - name: Show what was detected
        run: python -m ebook_audiobook.cli check --engine fake || true

      - name: Test
        run: python -m pytest -v --tb=short

  # An installed wheel is a different artifact from a source checkout: it can be
  # missing data files, have broken entry points, or resolve its data directory
  # to the wrong place. Test the thing users actually receive.
  wheel:
    name: wheel ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: The wheel's data files match the source tree exactly
        shell: python
        run: |
          import glob, pathlib, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())

          # Present, or the UI 500s on every page.
          required = [
              "ebook_audiobook/web/templates/base.html",
              "ebook_audiobook/web/templates/library.html",
              "ebook_audiobook/web/templates/job.html",
              "ebook_audiobook/web/static/app.css",
              "ebook_audiobook/web/static/app.js",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              print("MISSING FROM WHEEL:", *missing, sep="\n  ")
              sys.exit(1)

          # And nothing EXTRA. setuptools reuses a local build/lib directory, so
          # a stale checkout can ship a template that was deleted from the source
          # long ago — which is exactly what happened to a local install once.
          # CI builds clean so this should never fire here; it is the tripwire
          # that says the packaging has started carrying things it shouldn't.
          for kind in ("templates", "static"):
              on_disk = {p.name for p in
                         pathlib.Path(f"ebook_audiobook/web/{kind}").iterdir()
                         if p.is_file()}
              in_wheel = {n.rsplit("/", 1)[1] for n in names
                          if n.startswith(f"ebook_audiobook/web/{kind}/")
                          and not n.endswith("/")}
              extra = in_wheel - on_disk
              if extra:
                  print(f"STALE {kind} IN WHEEL (not in the source tree):",
                        *sorted(extra), sep="\n  ")
                  sys.exit(1)
              print(f"  {kind}: {len(in_wheel)} files, matching the source tree")
          print(f"{wheel}: data files verified")

      - name: Install the wheel into a clean environment
        shell: bash
        run: |
          python -m venv fresh
          if [ -d fresh/Scripts ]; then BIN=fresh/Scripts; else BIN=fresh/bin; fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install --upgrade pip
          "$BIN/python" -m pip install dist/*.whl

      - name: Entry points work
        shell: bash
        run: |
          "$BIN/ebook-audiobook" --help
          "$BIN/ebook-audiobook" paths
          "$BIN/ebook-audiobook" check --engine fake || true

      # `check` exits non-zero above purely because Calibre isn't on the runners,
      # which is correct behaviour. Assert the precise thing instead: Calibre may
      # be the only complaint, and ffmpeg must resolve from the bundled wheel.
      - name: Calibre must be the only missing prerequisite
        shell: bash
        run: |
          "$BIN/python" ci/assert_prereqs.py

      - name: A fresh install stores data in the per-user OS location
        shell: bash
        run: |
          out=$("$BIN/ebook-audiobook" paths)
          echo "$out"
          # It must NOT have adopted the checked-out source tree's directory.
          if echo "$out" | grep -qi "$(pwd)"; then
            echo "FAIL: installed copy is using the source checkout for data"
            exit 1
          fi

      - name: End-to-end render to a real .m4b (fake engine, bundled ffmpeg)
        shell: bash
        run: |
          "$BIN/python" ci/smoke_render.py

      - name: The web UI actually serves its pages
        shell: bash
        run: |
          "$BIN/python" ci/smoke_web.py

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: wheel
          path: dist/*.whl

  # Calibre is a hard requirement for real use — every import goes through
  # ebook-convert — so the tests that exercise it must actually run somewhere.
  # Installing it is slow, so this is one Linux job rather than part of the
  # matrix; the platform-specific risk there is finding the binary, which the
  # unit tests cover by simulating each OS.
  integration:
    name: integration (with Calibre)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calibre
          ebook-convert --version

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Every prerequisite must now be satisfied
        run: |
          python -m ebook_audiobook.cli check --engine fake
          python ci/assert_prereqs.py --require-calibre

      - name: Full suite, including the Calibre-dependent tests
        run: python -m pytest -v --tb=short

      - name: The Calibre-marked tests really ran (not silently skipped)
        run: |
          python -m pytest -m calibre -v --tb=short | tee out.txt
          grep -qE "[1-9][0-9]* passed" out.txt || {
            echo "no Calibre tests ran — they must have skipped"; exit 1; }

  # Resolving proves the *indexes* are right. It cannot prove the curated
  # dependency list is COMPLETE, because a missing package only shows up when
  # something imports it. Chatterbox declares einops nowhere yet imports it
  # unguarded in three modules — exactly the kind of gap --no-deps exposes and a
  # dry run does not. So install it for real, on the CPU build, and import the
  # engine. Gated to main/release: it downloads a few hundred MB.
  engine:
    name: the curated dependency list is complete
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install the engine exactly as the installer does
        run: |
          set -eu
          PIN="$(python -c 'from ebook_audiobook.torchbuild import TORCH_PIN; print(TORCH_PIN)')"
          CB="$(python -c 'from ebook_audiobook.torchbuild import CHATTERBOX_PIN; print(CHATTERBOX_PIN)')"
          DEPS="$(python -c 'from ebook_audiobook.torchbuild import CHATTERBOX_DEPS; print(" ".join(CHATTERBOX_DEPS))')"
          IDX="$(python -c "from ebook_audiobook.torchbuild import BUILDS; print(BUILDS['cpu'].index_url)")"
          python -m pip install --index-url "$IDX" --extra-index-url https://pypi.org/simple \
            "torch==$PIN" "torchaudio==$PIN"
          python -m pip install --no-deps "$CB"
          python -m pip install --index-url "$IDX" --extra-index-url https://pypi.org/simple \
            "torch==$PIN" "torchaudio==$PIN" $DEPS

      # The real test: every module Chatterbox imports at load time must be
      # present. An ImportError here means the curated list has a hole.
      - name: The engine imports
        run: |
          python - <<'PY'
          import chatterbox.tts                      # noqa: F401
          from chatterbox.tts import ChatterboxTTS   # noqa: F401
          import einops, librosa, transformers, diffusers, perth, s3tokenizer  # noqa: F401
          import torch
          print("chatterbox and every load-time dependency imported")
          print("torch", torch.__version__)
          PY

      - name: The build is the one we asked for, and the drops stayed dropped
        run: |
          set -eu
          python - <<'PY'
          import importlib.metadata as md
          from ebook_audiobook.torchbuild import FORBIDDEN_PACKAGES, TORCH_PIN
          import torch
          assert torch.__version__.startswith(TORCH_PIN), \
              f"expected torch {TORCH_PIN}, got {torch.__version__}"
          assert torch.__version__.endswith("+cpu"), \
              f"expected a CPU build, got {torch.__version__}"
          for pkg in FORBIDDEN_PACKAGES:
              try:
                  md.version(pkg)
              except md.PackageNotFoundError:
                  continue
              raise SystemExit(f"{pkg} was installed; --no-deps was bypassed")
          print(f"torch {torch.__version__}; none of {FORBIDDEN_PACKAGES} installed")
          PY

      - name: check reports a working engine
        run: |
          python -m ebook_audiobook.cli check --engine chatterbox | tee check.txt
          grep -q "chatterbox=yes" check.txt
          grep -q "torch 2.9" check.txt
          # The stale-torch warning must NOT appear on a correct install.
          if grep -q "predates 2.9" check.txt; then
            echo "check wrongly reported the torch it just installed as stale"; exit 1
          fi

  # The installers are the front door. A syntax error or a bad path in them is
  # just as user-visible as a bug in the app.
  installer:
    name: installer ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint install.sh
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          if command -v shellcheck >/dev/null; then shellcheck -S warning install.sh || true; fi

      # This gate decides whether a Mac user is told to expect a three-hour
      # render or a thirty-hour one, and it only ever executes on macOS — where
      # the runner reports one OS version, so CI would exercise a single branch
      # of it at best. Sourcing the function and feeding it versions costs
      # nothing and covers every boundary, including macOS 26.
      - name: The macOS Metal version gate is correct
        if: runner.os == 'Linux'
        run: |
          set -eu
          # Pull the helpers verbatim out of the installer, so this tests the
          # shipped code rather than a copy that can drift from it.
          sed -n '/BEGIN macos-metal-gate/,/END macos-metal-gate/p' install.sh > /tmp/gate.sh
          grep -q macos_supports_metal /tmp/gate.sh || { echo "helpers not found in install.sh"; exit 1; }
          check() {
            FAKE_VER="$1"; expected="$2"
            actual=$(
              . /tmp/gate.sh
              macos_version() { echo "$FAKE_VER"; }
              if macos_supports_metal; then echo metal; else echo cpu; fi
            )
            [ "$actual" = "$expected" ] || { echo "macOS $1: expected $expected, got $actual"; exit 1; }
            echo "  macOS ${1:-(empty)} -> $actual"
          }
          check 11.7.1 cpu       # Big Sur: no MPS
          check 12.2.1 cpu       # Monterey before 12.3
          check 12.3   metal     # the exact cutoff
          check 12.3.1 metal
          check 13.5   metal     # Ventura
          check 14.4.1 metal     # Sonoma
          check 15.2   metal     # Sequoia
          check 26.0   metal     # the version-number jump must not read as old
          check unknown cpu      # sw_vers missing or failed
          check "" cpu
          echo "macOS Metal gate correct at every boundary"

      # torchbuild.py is the only place a PyTorch index may be named. One CPU
      # fallback is allowed in each installer, for the case where the app can't
      # be imported at all; anything more means the duplication has returned.
      - name: PyTorch indexes live in exactly one place
        if: runner.os == 'Linux'
        run: |
          set -eu
          for f in install.sh install.ps1; do
            n=$(grep -c 'download\.pytorch\.org' "$f" || true)
            echo "  $f: $n reference(s)"
            [ "$n" -le 1 ] || { echo "ERROR: $f names a PyTorch index $n times; use ebook_audiobook.torchbuild"; exit 1; }
          done
          python - <<'PY'
          from ebook_audiobook.torchbuild import BUILDS, select
          # Every build must be reachable, or a flag silently does nothing.
          reachable = {
              select("linux", vendor="nvidia").id, select("linux", vendor="amd").id,
              select("linux").id, select("macos").id,
              # cu126 is only reachable via an old card's compute capability.
              select("linux", vendor="nvidia", compute_caps=[(6, 1)]).id,
          }
          missing = set(BUILDS) - reachable
          assert not missing, f"unreachable builds: {missing}"
          print(f"all {len(BUILDS)} builds reachable from the selection logic")
          PY

      # Every build we ship must resolve to the build we claim. Resolving only
      # (--dry-run) downloads no wheels, so all four take seconds. This is the
      # step that catches the failure mode that has now bitten twice: a pip
      # resolution quietly substituting a different PyTorch build than the
      # installer advertised.
      - name: Every PyTorch build resolves to what it claims
        if: runner.os == 'Linux'
        run: |
          set -eu
          PIN="$(python -c 'from ebook_audiobook.torchbuild import TORCH_PIN; print(TORCH_PIN)')"
          DEPS="$(python -c 'from ebook_audiobook.torchbuild import CHATTERBOX_DEPS; print(" ".join(CHATTERBOX_DEPS))')"
          for flavour in cpu cu126 cu128 rocm; do
            INDEX="$(python -c "from ebook_audiobook.torchbuild import BUILDS; print(BUILDS['$flavour'].index_url)")"
            test -n "$INDEX" || { echo "no index for $flavour"; exit 1; }
            echo "::group::$flavour -> $INDEX"
            # Mirrors the installer: pinned torch from the chosen index plus the
            # curated dependency list. Chatterbox is --no-deps at install time,
            # so it contributes nothing to this resolution.
            python -m pip install --dry-run --ignore-installed --quiet \
              --report "report-$flavour.json" \
              --index-url "$INDEX" --extra-index-url https://pypi.org/simple \
              "torch==$PIN" "torchaudio==$PIN" $DEPS
            python ci/assert_torch_build.py "report-$flavour.json" "$flavour"
            echo "::endgroup::"
          done

      - name: Parse install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "install.ps1 parses cleanly"

      # --no-tts keeps this to seconds instead of downloading gigabytes of torch;
      # everything else the installer does is exercised for real.
      - name: Run install.sh
        if: runner.os != 'Windows'
        run: bash install.sh --yes --no-tts

      - name: Run install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1 -Yes -NoTts

      - name: The installed launcher runs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ebook-audiobook check --engine fake
          ebook-audiobook paths

      - name: The installed launcher runs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:LOCALAPPDATA "ebook-audiobook\bin"
          & (Join-Path $bin "ebook-audiobook.cmd") check --engine fake
          & (Join-Path $bin "ebook-audiobook.cmd") paths

      - name: Uninstall leaves user data alone
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash install.sh --uninstall --yes
          # The program is gone...
          test ! -e "$HOME/.local/bin/ebook-audiobook" || { echo "launcher survived"; exit 1; }
          echo "uninstall clean"

      - name: Uninstall leaves user data alone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Uninstall -Yes
          $shim = Join-Path $env:LOCALAPPDATA "ebook-audiobook\bin\ebook-audiobook.cmd"
          if (Test-Path $shim) { Write-Host "launcher survived"; exit 1 }
          Write-Host "uninstall clean"
